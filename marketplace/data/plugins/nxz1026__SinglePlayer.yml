url: https://github.com/nxz1026/SinglePlayer
name: nxz1026/SinglePlayer
category: fun
description:
  en: 'AI-native music player plugin for DeepSeek Harness: aggregates NetEase Cloud Music, QQ Music and KuGou search with cross-provider playback fallback, renders word-by-word karaoke lyrics, and exposes search, playback, queue, alarm and volume control as model tools.'
  zh: '运行于 DeepSeek Harness 的 AI 原生音乐播放器（music player）：聚合网易云（NetEase）、QQ Music 与酷狗（KuGou）搜索并支持跨源播放回退，逐字卡拉OK歌词（karaoke lyrics），搜索、播放、队列、闹钟与音量控制均可由对话操控。'